[project]
name = "agent"
version = "0.1.0"
description = "upwork-scout — scrapes Upwork via Apify, screens new jobs, drafts proposals, alerts on Telegram."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.168",
    "pyyaml>=6.0",
    "apify-client==3.3.0",
    "psycopg[binary]==3.3.6",
    "telethon==1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-postgresql==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
# The agent loop is async throughout; auto mode saves marking every test.
asyncio_mode = "auto"
testpaths = ["tests"]
