[project]
name = "agent"
version = "0.1.0"
description = "TEMPLATE — one-line statement of what this agent does."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.105",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
# The agent loop is async throughout; auto mode saves marking every test.
asyncio_mode = "auto"
testpaths = ["tests"]
