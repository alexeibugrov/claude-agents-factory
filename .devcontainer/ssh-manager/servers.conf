# mcp-ssh-manager server definitions.
#
# Bind-mounted read-only to /home/node/.ssh-manager/.env inside the devcontainer — that filename is
# what the binary looks for, but the file is deliberately NOT named `.env` in the repo: `.env*` files
# are real secrets that Claude must never open, and this one is committed and secret-free (host,
# user, port, keypath, default dir only — the private key is mounted separately from the host).
#
# Format: SSH_SERVER_<NAME>_<FIELD> — see https://www.npmjs.com/package/mcp-ssh-manager
# Edits take effect after restarting the Claude Code session (the MCP child loads this once at startup);
# renaming or re-pointing the mount needs a container rebuild.

# Server: pulse — the runtime VM every agent stack is deployed to, one directory per agent under /app.
# Addressed by IP because the old app.pulse-ai.live DNS record no longer resolves.
#
# The identity is root AND mcp__ssh-manager is in permissions.allow, so remote commands neither hit a
# server-side wall nor a confirmation prompt. What constrains them is the operating rules in
# .claude/skills/ssh-mcp-server/SKILL.md. See kb/architecture/ssh-mcp.md.
SSH_SERVER_PULSE_HOST=157.90.18.149
SSH_SERVER_PULSE_USER=root
SSH_SERVER_PULSE_PORT=22
SSH_SERVER_PULSE_KEYPATH=/home/node/.ssh/pulse-vm-agent
SSH_SERVER_PULSE_DEFAULT_DIR=/app
SSH_SERVER_PULSE_DESCRIPTION="Runtime VM (agent stacks under /app)"
